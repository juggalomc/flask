<!DOCTYPE html>
<html>
<head>
    <title>Stock Analyzer</title>
</head>
<body>
    <h1>Stock Prediction Bot</h1>
    <form method="POST">
        <label for="symbol">Enter Stock Symbol:</label>
        <input type="text" name="symbol" required>
        <input type="submit" value="Analyze">
    </form>

    {% if signal %}
        <h2>Signal: {{ signal }}</h2>
    {% endif %}
    {% if error %}
        <p style="color: red;">Error: {{ error }}</p>
    {% endif %}
</body>
</html>
